name: Build tagged commit

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: tag-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HSB.sln

      - name: Build solution
        run: dotnet build HSB.sln --configuration ${{ matrix.configuration }} --no-restore
